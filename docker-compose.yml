services:
  app:
    image: ghcr.io/icaksh/jenkins-public-build-history:latest
    container_name: jenkins-public-build-history
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      DB_PATH: /app/data/data.db
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./data:/app/data
